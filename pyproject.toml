[project]
name = "newagent"
version = "0.1.0"
description = "文档驱动的 AI PPT 生成 Agent：解析文档、生成大纲与布局、渲染 PPTX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "instructor>=1.17.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-community>=0.4.1",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
